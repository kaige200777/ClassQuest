<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>开始测试</title>
    <link href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header text-center">
                    <h2>学习任务单系统</h2>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for message in messages %}
                            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                                <strong>⚠️ 提示：</strong> {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">姓名（2-4个汉字）</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ request.form.name }}" required pattern="[\u4e00-\u9fa5]{2,4}" title="姓名只能是2-4个汉字">
                        </div>
                        <div class="mb-3">
                            <label for="class_number" class="form-label">班级号（3位阿拉伯数字）</label>
                            <input type="text" class="form-control" id="class_number" name="class_number" value="{{ request.form.class_number }}" required pattern="\d{3}" maxlength="3" title="班级号只能是3位阿拉伯数字">
                        </div>
                        <div class="mb-3" id="testContentDiv" style="display: none;">
                            <label for="test_content" class="form-label">测试内容</label>
                            <select class="form-select" id="test_content" name="test_content">
                                <option value="">-- 请选择测试内容 --</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">开始测试</button>
                    </form>
                    

                </div>
            </div>
            <div class="text-center mt-3">
                <a href="/" class="link-primary">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('testContentDiv').style.display = 'block';
            loadTestPresets();
        });

        function loadTestPresets() {
            fetch('/api/test_presets_public')
                .then(response => response.json())
                .then(data => {
                    const select = document.getElementById('test_content');
                    select.innerHTML = '<option value="">-- 请选择测试内容 --</option>';
                    
                    if (data.presets && Array.isArray(data.presets) && data.presets.length > 0) {
                        data.presets.forEach(preset => {
                            const option = document.createElement('option');
                            option.value = preset.id;
                            const modeLabel = preset.test_mode === 'paper' ? ' [📄试卷]' : ' [📝题库]';
                            option.textContent = preset.title + modeLabel;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(error => {
                    console.error('加载测试预设失败:', error);
                });
        }
    </script>
</body>
</html>
